<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Bouquet 🎀</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0806}
canvas{display:block}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let w,h,particles=[],start;

const cOuter=["#b83020","#c94030","#a82818","#d05040"];
const cMid  =["#d86e5a","#e07a68","#c86050","#d87865"];
const cInner=["#e8a898","#f0b8a8","#f5c4b8","#e0a090"];
const cCore =["#fff0e0","#ffe8c8","#ffd8b0","#fff8f0"];
const cStem =["#4a6b3a","#5a7d48","#3d5c30"];
const cRibbon=["#c49480","#d4a890","#b08070"];
const cBow  =["#b04030","#c05040","#d06050","#a03828"];

function add(x,y,tx,ty,delay,type,color,size=0.45,rot=0){
  particles.push({
    x,y,tx,ty,delay,type,color,
    size:size*(0.5+Math.random()*0.55),
    phase:Math.random()*Math.PI*2,
    speed:0.75+Math.random()*0.45,
    rot:rot,
    ox:x, oy:y
  });
}

function petal(cx,cy,r,angle,delay,color,scale=1){
  for(let i=0;i<280;i++){
    const u=Math.random();
    const len=r*(0.02+u*0.98);
    const v=(Math.random()-0.5)*2;
    const widthFactor=Math.sin(Math.PI*u); 
    const width=r*0.30*widthFactor*v;
    const bend=Math.sin(u*Math.PI)*r*0.08*(v>0?1:-1);
    const x=len*scale;
    const y=(width+bend)*scale;
    const ca=Math.cos(angle), sa=Math.sin(angle);
    const tx=cx+x*ca-y*sa;
    const ty=cy+x*sa+y*ca;
    const sizeBoost=0.22+widthFactor*0.32;
    const rot=angle+(v*0.25);
    add(
      w/2+(Math.random()-0.5)*120,
      h+Math.random()*90,
      tx,ty,
      delay+Math.random()*0.18,
      "petal",color,
      0.26*sizeBoost,
      rot
    );
  }
}

function core(cx,cy,r,delay){
  for(let i=0;i<180;i++){
    const a=Math.random()*Math.PI*2;
    const rr=Math.sqrt(Math.random())*r*0.14;
    add(
      w/2+(Math.random()-0.5)*70,
      h+Math.random()*60,
      cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*0.6,
      delay+0.35,
      "core",cCore[Math.floor(Math.random()*cCore.length)],
      0.42
    );
  }
}

function flower(cx,cy,r,delay){
  for(let i=0;i<6;i++){
    const angle=i*Math.PI*2/6+Math.random()*0.14;
    petal(cx,cy,r*0.95,angle,delay+0.06,cOuter[Math.floor(Math.random()*cOuter.length)],1);
  }
  for(let i=0;i<5;i++){
    const angle=i*Math.PI*2/5+Math.PI/5+Math.random()*0.12;
    petal(cx,cy,r*0.72,angle,delay+0.14,cMid[Math.floor(Math.random()*cMid.length)],1.02);
  }
  for(let i=0;i<4;i++){
    const angle=i*Math.PI*2/4+0.25;
    petal(cx,cy,r*0.42,angle,delay+0.24,cInner[Math.floor(Math.random()*cInner.length)],1.05);
  }
  core(cx,cy,r,delay+0.32);
}

function stem(fx,fy,delay){
  const bx=w*0.50;
  const by=h*0.48;
  for(let i=0;i<18;i++){
    const t=Math.random();
    const cx1=(fx+bx)*0.5+(Math.random()-0.5)*18;
    const cy1=(fy+by)*0.5-8;
    const x=(1-t)*(1-t)*fx+2*(1-t)*t*cx1+t*t*bx;
    const y=(1-t)*(1-t)*fy+2*(1-t)*t*cy1+t*t*by;
    add(
      w/2+(Math.random()-0.5)*45,
      h+Math.random()*35,
      x,y,
      delay+0.42+t*0.1,
      "stem",cStem[Math.floor(Math.random()*cStem.length)],
      0.2
    );
  }
}

function ribbon(fx,fy,delay){
  const bx=w*0.50;
  const by=h*0.48;
  for(let i=0;i<22;i++){
    const t=0.25+Math.random()*0.65;
    const cx1=(fx+bx)*0.5;
    const cy1=(fy+by)*0.5-6;
    const x0=(1-t)*(1-t)*fx+2*(1-t)*t*cx1+t*t*bx;
    const y0=(1-t)*(1-t)*fy+2*(1-t)*t*cy1+t*t*by;
    const spiral=Math.sin(t*14+i)*6;
    add(
      w/2+(Math.random()-0.5)*40,
      h+Math.random()*30,
      x0+spiral,y0+Math.cos(t*14+i)*2.5,
      delay+0.46+t*0.08,
      "ribbon",cRibbon[Math.floor(Math.random()*cRibbon.length)],
      0.24
    );
  }
}

function bow(cx,y,delay){
  for(let i=0;i<70;i++){
    const u=Math.random(),v=Math.random();
    const wingX=-w*0.012-u*w*0.055;
    const wingY=v*w*0.035;
    const bulge=Math.sin(v*Math.PI)*w*0.015;
    add(
      w/2+(Math.random()-0.5)*35,
      h+Math.random()*35,
      cx+wingX+bulge*(1-u),y+wingY,
      delay+0.55+u*0.08,
      "bow",cBow[Math.floor(Math.random()*cBow.length)],
      0.32
    );
  }
  for(let i=0;i<70;i++){
    const u=Math.random(),v=Math.random();
    const wingX=w*0.012+u*w*0.055;
    const wingY=v*w*0.035;
    const bulge=Math.sin(v*Math.PI)*w*0.015;
    add(
      w/2+(Math.random()-0.5)*35,
      h+Math.random()*35,
      cx+wingX-bulge*(1-u),y+wingY,
      delay+0.55+u*0.08,
      "bow",cBow[Math.floor(Math.random()*cBow.length)],
      0.32
    );
  }
  for(let i=0;i<35;i++){
    const a=Math.random()*Math.PI*2;
    const rr=Math.sqrt(Math.random())*w*0.01;
    add(
      w/2+(Math.random()-0.5)*30,
      h+Math.random()*30,
      cx+Math.cos(a)*rr,y+Math.sin(a)*rr*0.5,
      delay+0.6,
      "bow",cBow[Math.floor(Math.random()*cBow.length)],
      0.38
    );
  }
  for(let side of [-1,1]){for(let i=0;i<45;i++){
      const u=Math.random();
      const x=cx+side*(w*0.015+u*w*0.035);
      const yPos=y+w*0.008+u*w*0.03;
      const wave=Math.sin(u*12)*w*0.006*(1-u*0.3);
      add(
        w/2+(Math.random()-0.5)*35,
        h+Math.random()*30,
        x+wave,yPos,
        delay+0.65+u*0.06,
        "bow",cBow[Math.floor(Math.random()*cBow.length)],
        0.26
      );
    }
  }
}

function createParticles(){
  particles=[];
  const centerX=w/2;
  const centerY=h*0.34;
  const spreadX=w*0.19;
  const spreadY=h*0.085;

  const flowers=[];
  for(let i=0;i<12;i++){
    let fx,fy,valid=false;
    let attempts=0;
    while(!valid && attempts<120){
      const a=Math.random()*Math.PI*2;
      const r=Math.sqrt(Math.random());
      fx=centerX+Math.cos(a)*spreadX*r;
      fy=centerY+Math.sin(a)*spreadY*r*0.7;
      if(fy>centerY){
        const push=(fy-centerY)/(spreadY*0.7);
        fx+=(centerX-fx)*push*0.5;
      }
      valid=true;
      for(let f of flowers){
        const dx=fx-f[0],dy=fy-f[1];
        if(Math.sqrt(dx*dx+dy*dy)<w*0.07){valid=false;break;}
      }
      attempts++;
    }
    if(valid){
      const ny=(fy-(centerY-spreadY*0.7))/(spreadY*1.5);
      const radius=46+Math.random()*10-(ny-0.5)*8;
      const delay=0.08+Math.random()*0.15+ny*0.3;
      flowers.push([fx,fy,radius,delay,ny]);
    }
  }

  flowers.sort((a,b)=>a[3]-b[3]);

  flowers.forEach(f=>{
    flower(f[0],f[1],f[2],f[3]);
    stem(f[0],f[1]+f[2]*0.42,f[3]);
    ribbon(f[0],f[1]+f[2]*0.42,f[3]);
  });

  bow(w*0.50,h*0.48,0.52);
}

function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
  createParticles();
  start=performance.now();
}

function draw(now){
  const t=(now-start)/1000;

  const bg=ctx.createRadialGradient(w/2,h*0.36,0,w/2,h*0.36,w*0.85);
  bg.addColorStop(0,"#1a1210");
  bg.addColorStop(1,"#0c0806");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);

  ctx.globalCompositeOperation="lighter";

  particles.forEach(p=>{
    const dt=t-p.delay;
    if(dt<0) return;

    const k=3.2*p.speed;
    const damp=2.6;
    const decay=Math.exp(-dt*damp);
    const ease=1-decay*(Math.cos(dt*k*3)+1)*0.5;
    const finalEase=Math.min(ease,1);

    const breathe=Math.sin(t*0.7+p.phase)*0.35*(finalEase>0.88?0.5:0);
    const sway=Math.sin(t*0.4+p.phase*0.4)*0.18*finalEase;

    const x=p.ox+(p.tx-p.ox)*finalEase+sway;
    const y=p.oy+(p.ty-p.oy)*finalEase+breathe;

    let alpha=1;
    if(dt<0.4) alpha=dt/0.4;
    if(p.type==="stem") alpha*=0.4;
    if(p.type==="ribbon") alpha*=0.6;
    if(p.type==="bow") alpha*=0.78;

    ctx.globalAlpha=alpha*0.7;

    const s=p.size*(0.8+Math.sin(t*1.6+p.phase)*0.08);
    ctx.fillStyle=p.color;
    ctx.beginPath();

    if(p.type==="petal"){
      ctx.ellipse(x,y,s*2.8,s*0.85,p.rot||0,0,Math.PI*2);
    }else if(p.type==="core"){
      ctx.arc(x,y,s*0.9,0,Math.PI*2);
    }else if(p.type==="stem"){
      ctx.arc(x,y,s*0.65,0,Math.PI*2);
    }else if(p.type==="ribbon"){
      ctx.arc(x,y,s*0.85,0,Math.PI*2);
    }else if(p.type==="bow"){
      ctx.arc(x,y,s*0.75,0,Math.PI*2);
    }
    ctx.fill();
  });

  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";

  requestAnimationFrame(draw);
}

window.addEventListener("resize",resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
