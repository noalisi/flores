<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orange Flowers 🧡</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050302;
}
canvas{
  display:block;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let w,h;
let dots=[];

function resize(){

  w=c.width=innerWidth;
  h=c.height=innerHeight;

  dots=[];

  /*
    先生成很多随机粒子
  */
  for(let i=0;i<1800;i++){

    const a=Math.random()*Math.PI*2;
    const r=Math.random()*140;

    dots.push({

      x:w/2+(Math.random()-.5)*120,
      y:h+Math.random()*100,

      /*
        目标位置：
        多朵花
      */

      tx:w/2+
        Math.cos(a)*r+
        (Math.random()-.5)*260,

      ty:h*.38+
        Math.sin(a)*r+
        (Math.random()-.5)*180,

      size:.8+Math.random()*2,

      color:[
        "#ff6500",
        "#ff8c24",
        "#ffb52e",
        "#ffd166",
        "#ff7043"
      ][Math.floor(Math.random()*5)],

      delay:Math.random()*0.5
    });
  }
}

let start=performance.now();

function draw(now){

  const t=(now-start)/1000;

  ctx.fillStyle="rgba(5,3,2,.18)";
  ctx.fillRect(0,0,w,h);

  for(const p of dots){

    let q=Math.max(
      0,
      Math.min(
        1,
        (t-p.delay)/1.2
      )
    );

    /*
      快速聚集
    */

    q=1-Math.pow(1-q,4);

    const x=p.x+(p.tx-p.x)*q;
    const y=p.y+(p.ty-p.y)*q;

    ctx.beginPath();

    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=8;

    ctx.arc(
      x,
      y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.shadowBlur=0;

  requestAnimationFrame(draw);
}

resize();
addEventListener("resize",resize);

requestAnimationFrame(draw);
</script>

</body>
</html>
