<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🌹 永生玫瑰</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a0a;
        }
        canvas {
            display: block;
        }
        .text {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: rgba(255, 100, 150, 0.7);
            font-size: 24px;
            font-family: 'Georgia', serif;
            letter-spacing: 4px;
            animation: fadeIn 4s ease-in;
            pointer-events: none;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="text">✦ 永不凋谢 ✦</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        let particles = [];
        let time = 0;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const ROSE_RADIUS = Math.min(w, h) * 0.28;
        const CENTER_X = w / 2;
        const CENTER_Y = h / 2 - 20;

        const colors = {
            petal: [
                '#ff1744', '#ff3d5c', '#ff5c7a', '#ff7a96',
                '#e91e63', '#f06292', '#ec407a', '#f48fb1',
                '#ff80ab', '#ff4081', '#f50057', '#c51162'
            ],
            center: ['#ffd54f', '#ffca28', '#ffb300', '#ffa000'],
            leaf: ['#2e7d32', '#388e3c', '#43a047', '#4caf50', '#66bb6a']
        };

        class Particle {
            constructor(x, y, z, type) {
                this.x = x;
                this.y = y;
                this.z = z;
                this.type = type;
                this.phase = Math.random() * Math.PI * 2;
                this.size = type === 'center' ? 2 + Math.random() * 3 :
                           type === 'leaf' ? 3 + Math.random() * 4 :
                           2.5 + Math.random() * 5;
                this.color = this.getColor();
                this.origX = x;
                this.origY = y;
                this.origZ = z;
            }

            getColor() {
                const palette = this.type === 'center' ? colors.center :
                               this.type === 'leaf' ? colors.leaf :
                               colors.petal;
                return palette[Math.floor(Math.random() * palette.length)];
            }

            update(angle) {
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                const rx = this.origX * cosA - this.origZ * sinA;
                const rz = this.origX * sinA + this.origZ * cosA;
                this.x = rx;
                this.z = rz;

                const breath = Math.sin(time * 0.5 + this.phase) * 2;
                this.y = this.origY + breath * 0.3;

                const scale = 0.8 + (this.z / ROSE_RADIUS + 1) * 0.3;
                this.displaySize = this.size * Math.max(0.4, Math.min(1.6, scale));
                this.alpha = Math.max(0.3, Math.min(1, 0.6 + (this.z / ROSE_RADIUS + 1) * 0.3));
            }

            draw() {
                const perspective = 1 + this.z / ROSE_RADIUS * 0.3;
                const px = CENTER_X + this.x * perspective;
                const py = CENTER_Y + this.y * perspective;

                ctx.save();
                ctx.globalAlpha = this.alpha * 0.9;
                ctx.translate(px, py);

                const s = this.displaySize;
                if (this.type === 'center') {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'leaf') {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(0,255,0,0.1)';
                    ctx.shadowBlur = 4;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.5, s * 0.9, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.ellipse(0, -s * 0.2, s * 0.45, s * 0.75, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = this.alpha * 0.15;
                    ctx.beginPath();
                    ctx.ellipse(-s * 0.1, -s * 0.3, s * 0.15, s * 0.25, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function createRose() {
            particles = [];

            const petalLayers = [
                { count: 1800, radius: 1.0, zRange: 0.6, yOffset: 0 },
                { count: 1400, radius: 0.82, zRange: 0.5, yOffset: -0.05 },
                { count: 1000, radius: 0.62, zRange: 0.4, yOffset: -0.08 },
                { count: 700, radius: 0.42, zRange: 0.3, yOffset: -0.10 },
                { count: 400, radius: 0.22, zRange: 0.2, yOffset: -0.12 },
            ];

            petalLayers.forEach((layer) => {
                for (let i = 0; i < layer.count; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const r = layer.radius * ROSE_RADIUS * Math.sqrt(Math.random());
                    const z = (Math.random() - 0.5) * layer.zRange * ROSE_RADIUS * 0.4;
                    const y = layer.yOffset * ROSE_RADIUS * 0.3 +
                             (Math.random() - 0.5) * ROSE_RADIUS * 0.15;

                    const curl = 1 - (r / (layer.radius * ROSE_RADIUS)) * 0.3;
                    const x = Math.cos(theta) * r * curl;
                    const yPos = Math.sin(theta) * r * curl * 0.4 + y;

                    particles.push(new Particle(x, yPos, z, 'petal'));
                }
            });

            for (let i = 0; i < 600; i++) {
                const theta = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()) * ROSE_RADIUS * 0.15;
                const z = (Math.random() - 0.5) * ROSE_RADIUS * 0.15;
                const x = Math.cos(theta) * r;
                const y = Math.sin(theta) * r * 0.3 - ROSE_RADIUS * 0.12;
                particles.push(new Particle(x, y, z, 'center'));
            }

            for (let i = 0; i < 200; i++) {
                const theta = Math.random() * Math.PI * 2;
                const r = ROSE_RADIUS * (0.5 + Math.random() * 0.4);
                const z = (Math.random() - 0.5) * ROSE_RADIUS * 0.2;
                const x = Math.cos(theta + 0.5) * r * 0.6;
                const y = Math.sin(theta + 0.5) * r * 0.2 + ROSE_RADIUS * 0.25;
                particles.push(new Particle(x, y, z, 'leaf'));
            }
        }

        function animate() {
            time += 0.02;
            const angle = time * 0.15;

            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            for (let i = 0; i < 80; i++) {
                const sx = (i * 137.5 + 50) % w;
                const sy = (i * 97.3 + 20) % h;
                const sr = 0.5 + Math.sin(i + time * 0.3) * 0.5;
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                ctx.fill();
            }

            particles.forEach(p => {
                p.update(angle);
                p.draw();
            });

            const grad = ctx.createRadialGradient(w/2, h*0.8, 0, w/2, h*0.8, w*0.5);
            grad.addColorStop(0, 'rgba(255,20,60,0.04)');
            grad.addColorStop(1, 'rgba(255,20,60,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            requestAnimationFrame(animate);
        }

        createRose();
        animate();

        window.addEventListener('resize', () => {
            resize();
        });
    </script>
</body>
</html>
```
