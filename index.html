<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Bouquet 🧡</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050302;
}
canvas{display:block}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let w,h;
let particles=[];
let start;

/* =========================
   配色
========================= */

const orange=[
  "#ff641f",
  "#ff7b2f",
  "#ff9348",
  "#ffad63"
];

const pink=[
  "#ff8fa3",
  "#ffb0bd",
  "#ffd0d7"
];

const cream=[
  "#ffe9d2",
  "#fff4e5",
  "#fffaf1"
];

const green=[
  "#506d35",
  "#6f8f49",
  "#91aa62"
];

/* =========================
   基础粒子
========================= */

function add(x,y,tx,ty,delay,type,color){

  particles.push({
    x,y,
    tx,ty,
    delay,
    type,
    color,
    size:.22+Math.random()*.55,
    phase:Math.random()*Math.PI*2,
    speed:.7+Math.random()*.5
  });
}

/* =========================
   花瓣
   用极坐标制造真正的花瓣形状
========================= */

function petal(cx,cy,r,angle,delay,color){

  const count=150;

  for(let i=0;i<count;i++){

    const u=Math.random();
    const v=Math.random();

    /*
      花瓣从花心向外变宽，
      外缘再稍微收拢
    */
    const length=r*(.15+.85*u);

    const width=
      r*.30*
      Math.sin(Math.PI*u)*
      (.65+.35*Math.random());

    const side=(v-.5)*2;

    /*
      花瓣轻微弯曲
    */
    const bend=
      Math.sin(u*Math.PI)*r*.12;

    let x=length;
    let y=side*width+bend;

    const ca=Math.cos(angle);
    const sa=Math.sin(angle);

    const tx=
      cx+x*ca-y*sa;

    const ty=
      cy+x*sa+y*ca;

    add(
      w/2+(Math.random()-.5)*120,
      h+Math.random()*120,
      tx,
      ty,
      delay+Math.random()*.2,
      "petal",
      color
    );
  }
}

/* =========================
   一朵花
========================= */

function flower(cx,cy,r,delay){

  const petals=7;

  for(let i=0;i<petals;i++){

    const angle=
      i*Math.PI*2/petals+
      Math.random()*.15;

    let color;

    const roll=Math.random();

    if(roll<.55){
      color=orange[
        Math.floor(Math.random()*orange.length)
      ];
    }
    else if(roll<.82){
      color=pink[
        Math.floor(Math.random()*pink.length)
      ];
    }
    else{
      color=cream[
        Math.floor(Math.random()*cream.length)
      ];
    }

    petal(
      cx,
      cy,
      r,
      angle,
      delay+i*.025,
      color
    );
  }

  /* 第二层花瓣 */
  for(let i=0;i<5;i++){

    const angle=
      i*Math.PI*2/5+
      .3;

    petal(
      cx,
      cy,
      r*.62,
      angle,
      delay+.18,
      Math.random()<.65
        ? "#ff8b45"
        : "#ffb7c2"
    );
  }

  /* 花心 */
  for(let i=0;i<110;i++){

    const a=Math.random()*Math.PI*2;
    const rr=Math.sqrt(Math.random())*r*.17;

    add(
      w/2+(Math.random()-.5)*100,
      h+Math.random()*100,
      cx+Math.cos(a)*rr,
      cy+Math.sin(a)*rr,
      delay+.25,
      "center",
      Math.random()<.5
        ? "#fff4df"
        : "#ffc46b"
    );
  }
}

/* =========================
   叶子
========================= */

function leaf(cx,cy,rx,ry,angle,delay){

  for(let i=0;i<230;i++){

    const a=(Math.random()-.5)*Math.PI;
    const rr=Math.sqrt(Math.random());

    let x=Math.cos(a)*rx*rr;
    let y=Math.sin(a)*ry*rr;

    /*
      叶尖稍微拉长
    */
    x*=1+.25*Math.abs(Math.cos(a));

    const tx=
      cx+x*Math.cos(angle)-y*Math.sin(angle);

    const ty=
      cy+x*Math.sin(angle)+y*Math.cos(angle);

    add(
      w/2+(Math.random()-.5)*100,
      h+Math.random()*100,
      tx,
      ty,
      delay+Math.random()*.15,
      "leaf",
      green[Math.floor(Math.random()*green.length)]
    );
  }
}

/* =========================
   花茎
========================= */

function stem(x,top,bottom,delay){

  for(let i=0;i<280;i++){

    const y=
      top+
      Math.random()*(bottom-top);

    const curve=
      Math.sin((y-top)*.018)*7+
      (y-top)*.035;

    add(
      w/2+(Math.random()-.5)*90,
      h+Math.random()*120,
      x+curve+(Math.random()-.5)*3,
      y,
      delay+Math.random()*.12,
      "stem",
      green[Math.floor(Math.random()*green.length)]
    );
  }
}

/* =========================
   花束布局
========================= */

  particles=[];

  const flowers=[

    /* 中间最高 */
    [w*.50,h*.25,58,.15],

    /* 左右 */
    [w*.38,h*.32,50,.32],
    [w*.62,h*.31,51,.46],

    /* 外侧 */
    [w*.29,h*.40,42,.60],
    [w*.71,h*.40,43,.72],

    /* 下层 */
    [w*.41,h*.44,45,.84],
    [w*.58,h*.44,46,.96]
  ];

  /*
    先长茎
  */
  flowers.forEach((f,i)=>{

    const stemX=
      w*.5+

    stem(
      stemX,
      f[1],
      h*.84,
      i*.04
    );
  });

  /*
    再长花

  flowers.forEach(f=>{
    flower(
      f[0],
      f[1],
      f[2],
      f[3]
    );
  });
