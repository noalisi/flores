<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orange Particle Bouquet 🧡</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050302;
}
canvas{display:block}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let w,h;
let particles=[];
let start;

const colors=[
  "#ff6500",
  "#ff8120",
  "#ff9f2d",
  "#ffc04a",
  "#ffd878",
  "#ff7043"
];

function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
  createParticles();
  start=performance.now();
}

/* 创建一个粒子 */
function add(x,y,tx,ty,delay,type){
  particles.push({
    x,y,tx,ty,
    delay,
    type,
    size:.45+Math.random()*.9,
    color:colors[Math.floor(Math.random()*colors.length)],
    phase:Math.random()*Math.PI*2,
    duration:.65+Math.random()*.35
  });
}

/* 花朵 */
function flower(cx,cy,r,delay){

  /* 花瓣 */
  for(let i=0;i<520;i++){

    const a=Math.random()*Math.PI*2;

    /*
      让边缘形成明显的花瓣起伏
    */
    const wave=
      .62+
      .38*Math.pow(
        Math.abs(Math.cos(a*5)),
        1.5
      );

    const rr=r*(.18+.82*Math.sqrt(Math.random()))*wave;

    const tx=cx+Math.cos(a)*rr;
    const ty=cy+Math.sin(a)*rr*.72;

    add(
      w/2+(Math.random()-.5)*100,
      h+Math.random()*100,
      tx,ty,
      delay+Math.random()*.15,
      "flower"
    );
  }

  /* 花心 */
  for(let i=0;i<130;i++){

    const a=Math.random()*Math.PI*2;
    const rr=Math.sqrt(Math.random())*r*.2;

    add(
      w/2+(Math.random()-.5)*80,
      h+Math.random()*100,
      cx+Math.cos(a)*rr,
      cy+Math.sin(a)*rr,
      delay,
      "center"
    );
  }
}

/* 花茎 */
function stem(x,top,bottom,delay){

  for(let i=0;i<300;i++){

    const y=top+Math.random()*(bottom-top);

    const curve=
      x+
      Math.sin(y*.025)*5+
      (y-top)*.035;

    add(
      w/2+(Math.random()-.5)*80,
      h+Math.random()*100,
      curve+(Math.random()-.5)*5,
      y,
      delay+Math.random()*.12,
      "stem"
    );
  }
}

/* 叶子 */
function leaf(cx,cy,rx,ry,angle,delay){

  for(let i=0;i<220;i++){

    const a=(Math.random()-.5)*Math.PI;
    const rr=Math.sqrt(Math.random());

    let x=Math.cos(a)*rx*rr;
    let y=Math.sin(a)*ry*rr;

    const tx=
      cx+x*Math.cos(angle)-y*Math.sin(angle);

    const ty=
      cy+x*Math.sin(angle)+y*Math.cos(angle);

    add(
      w/2+(Math.random()-.5)*90,
      h+Math.random()*100,
      tx,ty,
      delay+Math.random()*.12,
      "leaf"
    );
  }
}

function createParticles(){

  particles=[];

  const flowers=[
    [w*.29,h*.34,48,.15],
    [w*.41,h*.25,58,.32],
    [w*.53,h*.32,54,.49],
    [w*.65,h*.25,60,.66],
    [w*.76,h*.36,47,.83],
    [w*.36,h*.45,46,.92],
    [w*.58,h*.45,53,1.02],
    [w*.69,h*.46,45,1.12]
  ];

  /* 茎先形成 */
  flowers.forEach((f,i)=>{
    stem(
      w*.5+(f[0]-w*.5)*.32,
      f[1],
      h*.84,
      i*.04
    );
  });

  /* 花朵 */
  flowers.forEach(f=>{
    flower(f[0],f[1],f[2],f[3]);
  });

  /* 叶子 */
  leaf(w*.34,h*.55,62,22,-.55,.7);
  leaf(w*.68,h*.55,65,23,.55,.8);
  leaf(w*.44,h*.62,72,24,-.3,.9);
  leaf(w*.59,h*.62,70,24,.3,1);
}

function draw(now){

  const t=(now-start)/1000;

  ctx.fillStyle="rgba(5,3,2,.20)";
  ctx.fillRect(0,0,w,h);

  for(const p of particles){

    let q=(t-p.delay)/p.duration;

    q=Math.max(0,Math.min(1,q));

    /* 快速聚集 */
    q=1-Math.pow(1-q,4);

    let x=p.x+(p.tx-p.x)*q;
    let y=p.y+(p.ty-p.y)*q;

    if(q>=1){

      x+=Math.sin(t*1.6+p.phase)*.8;
      y+=Math.cos(t*1.4+p.phase)*.8;
    }

    ctx.beginPath();

    ctx.globalAlpha=.72+
      Math.sin(t*3+p.phase)*.28;

    ctx.fillStyle=p.color;

    ctx.shadowColor=p.color;
    ctx.shadowBlur=
      p.type==="center" ? 9 : 4;

    ctx.arc(
      x,y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  requestAnimationFrame(draw);
}

addEventListener("resize",resize);

resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
