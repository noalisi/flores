<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Bouquet 🧡</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050302;
}
canvas{display:block}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let w,h;
let particles=[];
let start;

/* 花束配色 */
const flowerColors=[
  "#ff6500", // 橙
  "#ff8120",
  "#ff9b32",
  "#ffb36b",
  "#ff8fa3", // 粉
  "#ffc0c9",
  "#fff1df", // 奶白
  "#fff8ec"
];

const leafColors=[
  "#56752f",
  "#76964a",
  "#9caf68"
];

function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
  createParticles();
  start=performance.now();
}

function add(x,y,tx,ty,delay,type,color){

  particles.push({
    x,y,tx,ty,
    delay,
    type,
    color,
    size:.28+Math.random()*.58,
    phase:Math.random()*Math.PI*2,
    duration:.75+Math.random()*.45
  });
}

/* 单朵花 */
function flower(cx,cy,r,delay){

  /* 外层花瓣 */
  for(let i=0;i<620;i++){

    const a=Math.random()*Math.PI*2;

    const petals=
      .62+
      .38*Math.pow(
        Math.abs(Math.cos(a*5)),
        1.8
      );

    const rr=
      r*(.18+.82*Math.sqrt(Math.random()))*
      petals;

    const tx=cx+Math.cos(a)*rr;
    const ty=cy+Math.sin(a)*rr*.72;

    let color;

    const roll=Math.random();

    if(roll<.58)
      color=flowerColors[Math.floor(Math.random()*4)];
    else if(roll<.82)
      color=flowerColors[4+Math.floor(Math.random()*2)];
    else
      color=flowerColors[6+Math.floor(Math.random()*2)];

    add(
      w/2+(Math.random()-.5)*120,
      h+Math.random()*120,
      tx,ty,
      delay+Math.random()*.22,
      "flower",
      color
    );
  }

  /* 花心 */
  for(let i=0;i<180;i++){

    const a=Math.random()*Math.PI*2;
    const rr=Math.sqrt(Math.random())*r*.22;

    add(
      w/2+(Math.random()-.5)*100,
      h+Math.random()*100,
      cx+Math.cos(a)*rr,
      cy+Math.sin(a)*rr,
      delay,
      "center",
      Math.random()<.55 ? "#fff1df" : "#ffc04a"
    );
  }
}

/* 花茎 */
function stem(x,top,bottom,delay){

  for(let i=0;i<330;i++){

    const y=top+Math.random()*(bottom-top);

    const curve=
      x+
      Math.sin(y*.022)*7+
      (y-top)*.035;

    add(
      w/2+(Math.random()-.5)*90,
      h+Math.random()*120,
      curve+(Math.random()-.5)*4,
      y,
      delay+Math.random()*.18,
      "stem",
      leafColors[Math.floor(Math.random()*leafColors.length)]
    );
  }
}

/* 叶子 */
function leaf(cx,cy,rx,ry,angle,delay){

  for(let i=0;i<260;i++){

    const a=(Math.random()-.5)*Math.PI;
    const rr=Math.sqrt(Math.random());

    let x=Math.cos(a)*rx*rr;
    let y=Math.sin(a)*ry*rr;

    const tx=
      cx+x*Math.cos(angle)-y*Math.sin(angle);

    const ty=
      cy+x*Math.sin(angle)+y*Math.cos(angle);

    add(
      w/2+(Math.random()-.5)*100,
      h+Math.random()*100,
      tx,ty,
      delay+Math.random()*.16,
      "leaf",
      leafColors[Math.floor(Math.random()*leafColors.length)]
    );
  }
}

function createParticles(){

  particles=[];

  /*
    中间高、两边低
    让整体更像真正捧花
  */
  const flowers=[
    [w*.34,h*.35,47,.15],
    [w*.45,h*.27,58,.30],
    [w*.57,h*.30,55,.45],
    [w*.68,h*.36,47,.60],

    [w*.40,h*.44,43,.76],
    [w*.54,h*.43,49,.88],
    [w*.64,h*.46,42,1.00]
  ];

  /* 茎 */
  flowers.forEach((f,i)=>{
    stem(
      w*.5+(f[0]-w*.5)*.25,
      f[1],
      h*.84,
      i*.045
    );
  });

  /* 花 */
  flowers.forEach(f=>{
    flower(f[0],f[1],f[2],f[3]);
  });

  /* 叶子 */
  leaf(w*.34,h*.56,65,23,-.55,.65);
  leaf(w*.67,h*.55,66,23,.55,.72);

  leaf(w*.43,h*.63,72,24,-.28,.82);
  leaf(w*.58,h*.63,70,24,.30,.90);
}

function draw(now){

  const t=(now-start)/1000;

  ctx.fillStyle="rgba(5,3,2,.18)";
  ctx.fillRect(0,0,w,h);

  for(const p of particles){

    let q=(t-p.delay)/p.duration;

    q=Math.max(0,Math.min(1,q));

    /* 柔和聚拢 */
    q=1-Math.pow(1-q,4);

    let x=p.x+(p.tx-p.x)*q;
    let y=p.y+(p.ty-p.y)*q;

    if(q>=1){

      /* 花束轻微呼吸 */
      x+=Math.sin(t*1.35+p.phase)*.55;
      y+=Math.cos(t*1.15+p.phase)*.55;
    }

    ctx.beginPath();

    ctx.globalAlpha=
      .62+
      Math.sin(t*2.7+p.phase)*.25;

    ctx.fillStyle=p.color;

    ctx.shadowColor=p.color;
    ctx.shadowBlur=
      p.type==="center" ? 7 : 2.5;

    ctx.arc(
      x,y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  requestAnimationFrame(draw);
}

addEventListener("resize",resize);

resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
